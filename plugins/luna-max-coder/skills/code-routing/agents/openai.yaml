interface:
  display_name: "Luna Max Code Routing"
  short_description: "Plan with an advanced primary; batch execution through Luna Max"
  default_prompt: >-
    Use $code-routing. Verify the accepted non-Luna primary, exact Luna Max role,
    requested capabilities, permissions, and confirmations. Then use one fresh
    Luna worker and one complete batch, pass artifacts instead of transcripts,
    run deterministic checks, and return for one final advanced-primary review.
    Route all code, shell, browser, Windows, web, and MCP execution through Luna.
policy:
  allow_implicit_invocation: true
