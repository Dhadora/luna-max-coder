interface:
  display_name: "Luna Max Code Routing"
  short_description: "Luna edits code or controls a browser; the primary does the rest"
  default_prompt: >-
    Use $code-routing to keep discovery, reads, shell, SSH, tests, research, MCP,
    and review in the selected advanced primary, and route only one exact code
    edit or one bounded browser action to Luna Max.
policy:
  allow_implicit_invocation: false
