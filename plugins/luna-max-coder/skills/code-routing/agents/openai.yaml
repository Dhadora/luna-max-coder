interface:
  display_name: "Luna Max Code Routing"
  short_description: "Plan with an advanced primary; batch execution through Luna Max"
  default_prompt: >-
    Use $code-routing to verify the accepted advanced primary and capabilities,
    set one stable route with a cumulative 12-call, 2-failure, 1-correction
    lifetime ledger, delegate one complete batch to one fresh Luna worker,
    refuse resets or bare resumes, and review compact artifact evidence once.
policy:
  allow_implicit_invocation: true
